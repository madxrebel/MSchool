<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSchool — School Management Software for Schools in Pakistan</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#f6f7f9" />
    <script>
      // Apply the saved theme before first paint (soft light is the default)
      (function () {
        var t = 'light';
        try { t = localStorage.getItem('mschool-theme') === 'dark' ? 'dark' : 'light'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#1b1d21' : '#f6f7f9');
      })();
    </script>
    <meta name="description" content="MSchool brings admissions, fees, attendance, exams, student records and parent communication into one simple system — built for schools in Pakistan. Book a free demo." />
    <meta property="og:title" content="MSchool — School Management Software for Schools in Pakistan" />
